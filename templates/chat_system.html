<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时对话系统</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    :root{
      --bg:#f5f5f5;
      --card:#ffffff;
      --muted:#7f8c8d;
      --border:#eee;
      --shadow:0 4px 12px rgba(0,0,0,0.10);
      --blue:#3498db;
      --green:#2ecc71;
      --red:#e74c3c;
      --text:#2c3e50;
    }

    body{
      font-family: "Microsoft YaHei", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      margin:0;
      padding:20px;
      color:#333;
    }

    h2{
      text-align:center;
      margin: 6px 0 18px;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .layout{
      max-width: 1280px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      min-height: 620px;
    }

    .left{
      flex: 1;
      padding: 18px;
      background:#fff;
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
      justify-content:flex-start;
    }

    .right{
      flex: 1;
      padding: 18px;
      background:#f9f9f9;
      border-left: 1px solid var(--border);
      display:flex;
      flex-direction:column;
      gap:14px;
      min-height:0;
    }

    /* ===== Cards ===== */
    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .card-title{
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .hint{
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    /* ===== Voice Recorder ===== */
    .voice-recorder{
      width:100%;
      max-width:560px;
      text-align:center;
    }

    .record-btn{
      padding: 12px 22px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor:pointer;
      transition: all .2s;
      display:inline-flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      user-select:none;
      font-size: 15px;
      font-weight: 650;
    }

    .record-btn:hover{ filter: brightness(0.95); transform: scale(1.02); }

    .record-btn.recording{
      background: var(--green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse{
      0%{ box-shadow: 0 0 0 0 rgba(46,204,113,0.65); }
      70%{ box-shadow: 0 0 0 10px rgba(46,204,113,0); }
      100%{ box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    }

    .timer{
      font-size: 22px;
      font-weight: 800;
      margin: 10px 0 6px;
      color: var(--text);
    }

    .recording-indicator{
      display:none;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin: 6px 0;
    }

    .recording-dot{
      width: 12px;
      height: 12px;
      background: var(--red);
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    @keyframes blink{
      0%,50%{ opacity: 1; }
      51%,100%{ opacity: 0; }
    }

    .status-message{
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
      word-break: break-word;
    }

    /* ===== Video ===== */
    video{
      width: 560px;
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      background:#000;
    }

    /* ===== Controls ===== */
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-weight: 750;
      color:#555;
      font-size: 13px;
    }

    input, select, textarea{
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      outline: none;
      box-sizing:border-box;
      background:#fff;
    }

    textarea{ resize: vertical; min-height: 64px; }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .btn{
      border:none;
      border-radius: 10px;
      padding: 10px 12px;
      cursor:pointer;
      font-weight: 750;
      transition: all .15s;
      white-space:nowrap;
    }

    .btn-primary{ background: var(--blue); color:#fff; }
    .btn-primary:hover{ filter: brightness(0.95); }

    .btn-green{ background: var(--green); color:#fff; }
    .btn-green:hover{ filter: brightness(0.95); }

    .btn-ghost{
      background:#fff;
      border:1px solid #ddd;
      color:#444;
    }
    .btn-ghost:hover{ background:#fafafa; }

    .btn:disabled{ opacity: .6; cursor:not-allowed; }

    /* ===== Chat ===== */
    .chat-wrap{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
      flex:1;
    }

    .chat-messages{
      flex:1;
      min-height: 280px;
      overflow-y:auto;
      background:#fafafa;
      border:1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    .msg{ display:flex; margin:8px 0; }
    .msg-user{ justify-content:flex-end; }
    .msg-assistant{ justify-content:flex-start; }

    .bubble{
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .msg-user .bubble{
      background: var(--blue);
      color:#fff;
      border-bottom-right-radius: 4px;
    }

    .msg-assistant .bubble{
      background: #fff;
      border:1px solid #e8e8e8;
      color:#333;
      border-bottom-left-radius: 4px;
    }

    .bubble-thinking{
      opacity:.72;
      font-style: italic;
    }

    .chat-input-row{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }

    #chatInput{
      flex:1;
      min-height: 42px;
      max-height: 160px;
    }

    .small{
      font-size:12px;
      color: var(--muted);
    }

    @media (max-width: 980px){
      .layout{ flex-direction: column; }
      .right{ border-left:none; border-top:1px solid var(--border); }
      video{ width: 100%; }
    }
  </style>
</head>

<body class="subpage-bg">
  <h2>实时对话系统</h2>

  <div class="layout">
    <!-- ========== Left: Voice + Video ========== -->
    <div class="left">
      <div class="card voice-recorder">
        <div class="card-title">
          <span>语音输入</span>
          <span class="hint">Edge/Chrome Web Speech</span>
        </div>

        <button id="recordButton" class="record-btn" type="button">
          <span>●</span> 开始录音
        </button>

        <div class="timer" id="timer">00:00</div>

        <div class="recording-indicator" id="recordingIndicator">
          <div class="recording-dot"></div>
          <span>正在录音...</span>
        </div>

        <div class="status-message" id="statusMessage">准备录音</div>

        <div class="small" style="margin-top:10px; text-align:left;">
          若提示 <b>not-allowed</b>：请在地址栏权限里允许麦克风；并尽量使用 <b>localhost/HTTPS</b>。企业策略禁用时需改用“录音上传后端 ASR”方案。
        </div>
      </div>

      <div class="card" style="width:100%; max-width:560px;">
        <div class="card-title">
          <span>视频显示</span>
          <span class="hint">static/videos/sample.mp4</span>
        </div>

        <video id="chatVideo" controls>
          <source src="{{ url_for('static', filename='videos/sample.mp4') }}" type="video/mp4">
        </video>

        <div class="small" id="videoHint" style="margin-top:8px;"></div>
      </div>
    </div>

    <!-- ========== Right: Controls + Chat ========== -->
    <div class="right">
      <div class="card">
        <div class="card-title">
          <span>推理设置</span>
          <button id="btnReset" class="btn btn-ghost" type="button">恢复默认</button>
        </div>

        <div class="grid">
          <div class="field">
            <label for="modelSelect">模型（可自定义）</label>
            <input id="modelSelect" list="modelList" placeholder="例如：gpt-4.1 / your-model" />
            <datalist id="modelList">
              <option value="gpt-4.1"></option>
              <option value="gpt-4.1-mini"></option>
              <option value="deepseek-chat"></option>
              <option value="qwen2.5"></option>
            </datalist>
          </div>

          <div class="field">
            <label for="temperature">Temperature (0~2)</label>
            <input id="temperature" type="number" min="0" max="2" step="0.1" />
          </div>

          <div class="field">
            <label for="topP">Top-p (0~1)</label>
            <input id="topP" type="number" min="0" max="1" step="0.05" />
          </div>

          <div class="field">
            <label for="maxTokens">Max tokens</label>
            <input id="maxTokens" type="number" min="1" max="8192" step="1" />
          </div>

          <div class="field">
            <label for="presencePenalty">Presence penalty (-2~2)</label>
            <input id="presencePenalty" type="number" min="-2" max="2" step="0.1" />
          </div>

          <div class="field">
            <label for="frequencyPenalty">Frequency penalty (-2~2)</label>
            <input id="frequencyPenalty" type="number" min="-2" max="2" step="0.1" />
          </div>
        </div>

        <div class="field" style="margin-top:10px;">
          <label for="systemPrompt">系统提示词（System Prompt）</label>
          <textarea id="systemPrompt" placeholder="例如：你是一个耐心、简洁的助手。"></textarea>
        </div>

        <div class="row" style="margin-top:10px;">
          <button id="btnApply" class="btn btn-primary" type="button">应用到本次会话</button>
          <span class="small" id="applyHint">参数会随每次发送一并提交到 /api/chat/avatar</span>
        </div>
      </div>

      <div class="card chat-wrap">
        <div class="card-title">
          <span>文字对话</span>
          <span class="hint" id="apiHint">POST /api/chat/avatar</span>
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="输入文本并发送（或用左侧语音）"></textarea>
          <button id="sendBtn" class="btn btn-green" type="button">发送</button>
        </div>

        <div class="small" id="chatStatus"></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      // =========================
      // 默认配置
      // =========================
      const DEFAULTS = {
        model: "gpt-4.1-mini",
        temperature: 0.7,
        top_p: 1.0,
        max_tokens: 512,
        presence_penalty: 0.0,
        frequency_penalty: 0.0,
        system_prompt: ""
      };

      // =========================
      // 获取 DOM 元素
      // =========================
      const modelSelect = document.getElementById("modelSelect");
      const temperatureEl = document.getElementById("temperature");
      const topPEl = document.getElementById("topP");
      const maxTokensEl = document.getElementById("maxTokens");
      const presenceEl = document.getElementById("presencePenalty");
      const frequencyEl = document.getElementById("frequencyPenalty");
      const systemPromptEl = document.getElementById("systemPrompt");
      const btnReset = document.getElementById("btnReset");
      const btnApply = document.getElementById("btnApply");
      const applyHint = document.getElementById("applyHint");
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const chatStatus = document.getElementById("chatStatus");
      const videoEl = document.getElementById("chatVideo");
      const videoHint = document.getElementById("videoHint");
      const recordButton = document.getElementById("recordButton");
      const timerEl = document.getElementById("timer");
      const indicatorEl = document.getElementById("recordingIndicator");
      const statusEl = document.getElementById("statusMessage");

      // =========================
      // 工具函数
      // =========================
      function setChatStatus(t) { chatStatus.textContent = t || ""; }
      function setVoiceStatus(t) { statusEl.textContent = t || ""; }
      function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

      function appendMessage(role, text, extraClass = "") {
        const row = document.createElement("div");
        row.className = "msg " + (role === "user" ? "msg-user" : "msg-assistant");
        const bubble = document.createElement("div");
        bubble.className = "bubble " + (extraClass || "");
        bubble.textContent = text;
        row.appendChild(bubble);
        chatMessages.appendChild(row);
        scrollToBottom();
        return bubble;
      }

      function loadDefaults() {
        modelSelect.value = DEFAULTS.model;
        temperatureEl.value = DEFAULTS.temperature;
        topPEl.value = DEFAULTS.top_p;
        maxTokensEl.value = DEFAULTS.max_tokens;
        presenceEl.value = DEFAULTS.presence_penalty;
        frequencyEl.value = DEFAULTS.frequency_penalty;
        systemPromptEl.value = DEFAULTS.system_prompt;
      }

      function getParams() {
        return {
          model: modelSelect.value || DEFAULTS.model,
          temperature: parseFloat(temperatureEl.value) || DEFAULTS.temperature,
          top_p: parseFloat(topPEl.value) || DEFAULTS.top_p,
          max_tokens: parseInt(maxTokensEl.value) || DEFAULTS.max_tokens,
          presence_penalty: parseFloat(presenceEl.value) || DEFAULTS.presence_penalty,
          frequency_penalty: parseFloat(frequencyEl.value) || DEFAULTS.frequency_penalty,
          system_prompt: systemPromptEl.value || DEFAULTS.system_prompt
        };
      }

      // =========================
      // 核心业务逻辑
      // =========================
async function sendTextMessage(text, source = "text") {
  const clean = (text || "").trim();
  if (!clean) return;

  setChatStatus("");
  appendMessage("user", clean);
  const thinking = appendMessage("assistant", "任务已提交，请稍候...", "bubble-thinking");
  sendBtn.disabled = true;

  try {
    const params = getParams();
    // 1. 提交任务，获取 job_id
    const resp = await fetch("/api/chat/avatar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: clean, ...params })
    });

    if (!resp.ok) {
        const errorText = await resp.text();
        throw new Error(`服务器返回错误 (${resp.status}): ${errorText.substring(0, 100)}`);
    }
    const { job_id } = await resp.json();

    // 2. 开始轮询状态
    const pollTimer = setInterval(async () => {
      const statusResp = await fetch(`/api/chat/job_status/${job_id}`);
      const job = await statusResp.json();

      if (job.status === "completed") {
        clearInterval(pollTimer); // 停止轮询
        
        // 更新文字和视频
        thinking.textContent = job.assistant_text;
        thinking.classList.remove("bubble-thinking");
        
        videoEl.src = job.video_url + "?t=" + Date.now();
        videoEl.load();
        videoEl.play().catch(e => console.warn("播放受限:", e));
        
        setChatStatus(`生成成功（模型：${params.model}）`);
        sendBtn.disabled = false;
      } else if (job.status === "failed") {
        clearInterval(pollTimer);
        thinking.textContent = "生成失败: " + job.error;
        thinking.classList.remove("bubble-thinking");
        sendBtn.disabled = false;
      } else {
        // 还在处理中，可以更新一下提示文字
        thinking.textContent = "奥巴马正在思考并画图中...";
      }
    }, 3000); // 每 3 秒查询一次

  } catch (err) {
    thinking.textContent = "提交出错：" + err.message;
    thinking.classList.remove("bubble-thinking");
    sendBtn.disabled = false;
  }
}

      // =========================
      // 事件绑定
      // =========================
      sendBtn.addEventListener("click", () => {
        const t = chatInput.value;
        chatInput.value = "";
        sendTextMessage(t, "text");
      });

      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      });

      btnReset.addEventListener("click", loadDefaults);

      // =========================
      // 语音识别 (Web Speech API)
      // =========================
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        recordButton.disabled = true;
        setVoiceStatus("浏览器不支持语音识别，请使用 Edge/Chrome 并确保 HTTPS 环境。");
      } else {
        const rec = new SpeechRecognition();
        rec.lang = "zh-CN";
        rec.onstart = () => {
          recordButton.classList.add("recording");
          recordButton.textContent = "停止录音";
          setVoiceStatus("正在听...");
        };
        rec.onresult = (e) => {
          const text = e.results[0][0].transcript;
          setVoiceStatus("识别到：" + text);
          sendTextMessage(text, "voice");
        };
        rec.onend = () => {
          recordButton.classList.remove("recording");
          recordButton.textContent = "开始录音";
        };
        rec.onerror = (e) => setVoiceStatus("识别错误: " + e.error);
        
        recordButton.addEventListener("click", () => {
          try { rec.start(); } catch(e) { rec.stop(); }
        });
      }

      // 初始化
      loadDefaults();
      console.log("✅ 实时对话系统 JS 加载完成");
    })();
  </script>
</body>
</html>
