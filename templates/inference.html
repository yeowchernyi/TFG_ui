<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型推理 - DATA HAMMER TALKING SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: #4A90E2 !important;
        }
        
        .page-header {
            background: linear-gradient(135deg, #4A90E2, #7B68EE);
            color: white;
            padding: 50px 0;
            margin-bottom: 40px;
            border-radius: 0 0 20px 20px;
        }
        
        .inference-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
        }
        
        .model-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .model-card:hover {
            border-color: #4A90E2;
            transform: translateY(-2px);
        }
        
        .model-card.selected {
            border-color: #4A90E2;
            background: rgba(74, 144, 226, 0.1);
        }
        
        .audio-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4A90E2, #7B68EE);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }
        
        .video-preview {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-hammer"></i> DATA HAMMER
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="/chat_system">人机对话</a></li>
                    <li class="nav-item"><a class="nav-link" href="/model_training">模型训练</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/inference">模型推理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/video_generation">视频生成</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- 页面标题 -->
    <header class="page-header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">模型推理测试</h1>
            <p class="lead mb-0">使用训练好的模型生成语音驱动的人脸动画</p>
        </div>
    </header>
    
    <!-- 推理界面 -->
    <main class="container">
        <!-- 选择模型 -->
        <div class="inference-panel">
            <h2><i class="fas fa-robot"></i> 选择训练好的模型</h2>
            <div id="modelList" class="row mt-3">
                <!-- 模型列表会动态加载 -->
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在加载可用模型...</p>
                </div>
            </div>
        </div>
        
        <!-- 输入音频 -->
        <div class="inference-panel">
            <h2><i class="fas fa-microphone"></i> 输入音频</h2>
            <div class="mt-3">
                <div class="audio-controls">
                    <input type="file" id="audioFile" accept="audio/*" style="display: none;">
                    <button class="btn btn-primary" onclick="document.getElementById('audioFile').click()">
                        <i class="fas fa-file-audio"></i> 选择音频文件
                    </button>
                    <button class="btn btn-outline-primary" onclick="startRecording()" id="recordBtn">
                        <i class="fas fa-microphone"></i> 开始录音
                    </button>
                    <span id="audioStatus" class="text-muted">未选择音频</span>
                </div>
                <audio id="audioPreview" controls class="mt-3 w-100" style="display: none;"></audio>
            </div>
        </div>
        
        <!-- 生成设置 -->
        <div class="inference-panel">
            <h2><i class="fas fa-cogs"></i> 生成设置</h2>
            <div class="row mt-3">
                <div class="col-md-6">
                    <label class="form-label">生成质量</label>
                    <select id="quality" class="form-select">
                        <option value="fast">快速模式</option>
                        <option value="standard" selected>标准质量</option>
                        <option value="high">高质量</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">渲染模式</label>
                    <select id="renderMode" class="form-select">
                        <option value="standard">标准渲染</option>
                        <option value="incremental" selected>增量渲染 (内存优化)</option>
                        <option value="chunked">分块渲染 (超大文件)</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- 生成按钮和结果 -->
        <div class="text-center my-5">
            <button class="btn btn-primary btn-lg px-5 py-3" onclick="generateVideo()">
                <i class="fas fa-play-circle me-2"></i> 生成动画视频
            </button>
            
            <div id="resultContainer" class="mt-4" style="display: none;">
                <h3 class="mb-4">生成结果</h3>
                <div id="videoResult" class="video-preview">
                    <!-- 生成的视频会显示在这里 -->
                </div>
                <div id="resultInfo" class="mt-3 text-muted"></div>
            </div>
        </div>
    </main>
    
    <script>
        // 全局变量
        let selectedModel = null;
        let audioBlob = null;
        let mediaRecorder = null;
        let audioChunks = [];
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            loadAvailableModels();
            setupAudioUpload();
        });
        
        // 加载可用模型
        async function loadAvailableModels() {
            try {
                const response = await fetch('/api/models/list');
                const data = await response.json();
                
                const modelList = document.getElementById('modelList');
                
                if (data.success && data.models.length > 0) {
                    modelList.innerHTML = '';
                    
                    data.models.forEach(model => {
                        const col = document.createElement('div');
                        col.className = 'col-md-4 mb-3';
                        
                        col.innerHTML = `
                            <div class="model-card" data-path="${model.path}">
                                <h5 class="mb-2">${model.display_name || model.name}</h5>
                                <p class="text-muted small mb-1">
                                    <i class="fas fa-calendar"></i> ${model.created_date}
                                </p>
                                <p class="text-muted small mb-2">
                                    <i class="fas fa-hdd"></i> ${model.size}
                                </p>
                                <span class="badge bg-success">训练完成</span>
                            </div>
                        `;
                        
                        col.querySelector('.model-card').addEventListener('click', function() {
                            // 移除其他卡片的选中状态
                            document.querySelectorAll('.model-card').forEach(card => {
                                card.classList.remove('selected');
                            });
                            // 选中当前卡片
                            this.classList.add('selected');
                            selectedModel = this.getAttribute('data-path');
                            console.log('选择模型:', selectedModel);
                        });
                        
                        modelList.appendChild(col);
                    });
                } else {
                    modelList.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                            <h5>没有找到训练好的模型</h5>
                            <p class="text-muted">请先到<a href="/model_training">模型训练</a>页面训练一个模型</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载模型失败:', error);
                document.getElementById('modelList').innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-exclamation-circle fa-3x text-danger mb-3"></i>
                        <h5>加载失败</h5>
                        <p class="text-muted">${error.message}</p>
                    </div>
                `;
            }
        }
        
        // 设置音频上传
        function setupAudioUpload() {
            const audioFile = document.getElementById('audioFile');
            const audioStatus = document.getElementById('audioStatus');
            const audioPreview = document.getElementById('audioPreview');
            
            audioFile.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    audioBlob = file;
                    
                    const fileSize = (file.size / 1024 / 1024).toFixed(2);
                    audioStatus.textContent = `${file.name} (${fileSize} MB)`;
                    audioStatus.className = 'text-success';
                    
                    audioPreview.src = URL.createObjectURL(file);
                    audioPreview.style.display = 'block';
                }
            });
        }
        
        // 录音功能
        async function startRecording() {
            const recordBtn = document.getElementById('recordBtn');
            const audioStatus = document.getElementById('audioStatus');
            const audioPreview = document.getElementById('audioPreview');
            
            if (recordBtn.textContent.includes('开始录音')) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        
                        const duration = audioChunks.length * 0.1;
                        audioStatus.textContent = `录音完成 (${duration.toFixed(1)}秒)`;
                        audioStatus.className = 'text-success';
                        
                        audioPreview.src = URL.createObjectURL(audioBlob);
                        audioPreview.style.display = 'block';
                    };
                    
                    mediaRecorder.start();
                    recordBtn.innerHTML = '<i class="fas fa-stop-circle"></i> 停止录音';
                    audioStatus.textContent = '录音中...';
                    audioStatus.className = 'text-danger';
                    
                } catch (error) {
                    alert('无法访问麦克风: ' + error.message);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    recordBtn.innerHTML = '<i class="fas fa-microphone"></i> 开始录音';
                }
            }
        }
        
        // 生成视频
        async function generateVideo() {
            if (!selectedModel) {
                alert('请先选择一个模型');
                return;
            }
            
            if (!audioBlob) {
                alert('请先上传或录制音频');
                return;
            }
            
            // 显示加载状态
            const resultContainer = document.getElementById('resultContainer');
            const videoResult = document.getElementById('videoResult');
            const resultInfo = document.getElementById('resultInfo');
            
            videoResult.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在生成视频...</p>
                    <p class="text-muted small">这可能需要几分钟时间</p>
                </div>
            `;
            resultContainer.style.display = 'block';
            resultInfo.textContent = '正在处理...';
            
            try {
                // 上传音频文件和配置
                const formData = new FormData();
                formData.append('audio', audioBlob, 'input.wav');
                formData.append('model_path', selectedModel);
                formData.append('quality', document.getElementById('quality').value);
                formData.append('render_mode', document.getElementById('renderMode').value);
                
                // 发送请求
                const response = await fetch('/api/inference/generate', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 显示生成的视频
                    videoResult.innerHTML = `
                        <video controls autoplay class="w-100" style="border-radius: 10px;">
                            <source src="${data.video_url}" type="video/mp4">
                            您的浏览器不支持视频标签。
                        </video>
                    `;
                    
                    resultInfo.innerHTML = `
                        <div class="alert alert-success">
                            <h5><i class="fas fa-check-circle"></i> 视频生成成功！</h5>
                            <p class="mb-1">文件: ${data.filename}</p>
                            <p class="mb-1">大小: ${data.size}</p>
                            <p class="mb-3">用时: ${data.processing_time}秒</p>
                            <a href="${data.video_url}" download class="btn btn-primary">
                                <i class="fas fa-download"></i> 下载视频
                            </a>
                        </div>
                    `;
                    
                    // 自动播放视频
                    setTimeout(() => {
                        const video = videoResult.querySelector('video');
                        if (video) video.play();
                    }, 500);
                    
                } else {
                    videoResult.innerHTML = `
                        <div class="alert alert-danger text-center py-5">
                            <i class="fas fa-exclamation-circle fa-3x mb-3"></i>
                            <h5>生成失败</h5>
                            <p>${data.error || '未知错误'}</p>
                        </div>
                    `;
                    resultInfo.textContent = '';
                }
            } catch (error) {
                videoResult.innerHTML = `
                    <div class="alert alert-warning text-center py-5">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                        <h5>请求失败</h5>
                        <p>${error.message}</p>
                    </div>
                `;
                resultInfo.textContent = '';
            }
        }
    </script>
</body>
</html>
